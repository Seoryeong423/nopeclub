<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>nope.club 회원증 발급</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.8/dist/web/pretendard.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <div class="container">
    <h1><span class="highlight">nope.club</span> 회원증 발급</h1>

    <div class="name-date-container">
        <div>
            <label for="nameInput">이름:</label>
            <input id="nameInput" type="text" placeholder="이름">
        </div>
        <div>
            <label for="dateDisplay">날짜:</label>
            <span id="dateDisplay"></span>
        </div>
    </div>
    <p class="preview-info">이름, 날짜, 도장을 자유롭게 움직여<br>원하는 위치에 배치하세요☺️</p>

    <div id="cardPreview">
        <img src="static/images/card.png" id="cardBackground" alt="배경 이미지">
        <div id="overlay">
            <div id="nameText" class="draggable">이름</div>
            <div id="dateText" class="draggable"></div>
            <img id="stampImage" class="draggable" src="" alt="도장">
        </div>
    </div>

    <h3>도장 선택</h3>
    <div class="stamp-options">
      <img src="static/images/stamp1.png" class="stamp-preview" data-stamp="stamp1">
      <img src="static/images/stamp2.png" class="stamp-preview" data-stamp="stamp2">
      <img src="static/images/stamp3.png" class="stamp-preview" data-stamp="stamp3">
    </div>
    <p class="stamp-info">📌 도장은 저장될 때<br>미리보기에서 보이는 위치보다<br>(훨씬) 아래쪽에 찍힙니다.😅</p>

    <div class="button-group">
      <button id="rotateLeft">← 15°</button>
      <button id="rotateRight">→ 15°</button>
      <button id="zoomIn">확대</button>
      <button id="zoomOut">축소</button>
    </div>

    <button id="downloadBtn">회원증 다운로드</button>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
    let nameInput = document.getElementById("nameInput");
    let nameText = document.getElementById("nameText");
    let dateText = document.getElementById("dateText");
    let stampImage = document.getElementById("stampImage");
    let backgroundImg = document.getElementById("cardBackground");

    // ✅ 오늘 날짜 자동 입력
    function getFormattedDate() {
        let now = new Date();
        let year = now.getFullYear();
        let month = String(now.getMonth() + 1).padStart(2, '0');
        let day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }
    let todayDate = getFormattedDate();
    document.getElementById("dateDisplay").textContent = todayDate;
    dateText.textContent = todayDate;

    // ✅ 이름 입력 시 실시간 반영
    nameInput.addEventListener("input", function () {
        nameText.textContent = this.value.trim() || "이름";
    });

    // ✅ 도장 선택 기능 (겹치는 문제 해결!)
    document.querySelectorAll(".stamp-preview").forEach(img => {
        img.addEventListener("click", function () {
            document.querySelectorAll(".stamp-preview").forEach(opt => opt.classList.remove("selected"));
            img.classList.add("selected");

            // 기존 도장 삭제 후 새 도장 적용
            stampImage.src = img.src;
            stampImage.style.display = "block";

            // 🔹 도장 크기 초기화 (확대된 경우 원래 크기로 되돌리기)
            stampImage.style.transform = "rotate(0deg) scale(1)";
            stampImage.setAttribute("data-rotation", "0");
            stampImage.setAttribute("data-scale", "1");
        });
    });

    // ✅ 드래그 & 터치 이동 기능
    function makeDraggable(el) {
        let offsetX, offsetY;

        function dragMouseDown(e) {
            e.preventDefault();
            offsetX = e.clientX - el.offsetLeft;
            offsetY = e.clientY - el.offsetTop;
            document.onmousemove = elementDrag;
            document.onmouseup = closeDragElement;
        }

        function dragTouchStart(e) {
            let touch = e.touches[0];
            offsetX = touch.clientX - el.offsetLeft;
            offsetY = touch.clientY - el.offsetTop;
            document.ontouchmove = elementDrag;
            document.ontouchend = closeDragElement;
        }

        function elementDrag(e) {
            e.preventDefault();
            let clientX = e.type.includes("touch") ? e.touches[0].clientX : e.clientX;
            let clientY = e.type.includes("touch") ? e.touches[0].clientY : e.clientY;
            el.style.left = `${clientX - offsetX}px`;
            el.style.top = `${clientY - offsetY}px`;
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;
        }

        el.onmousedown = dragMouseDown;
        el.ontouchstart = dragTouchStart;
    }

    makeDraggable(nameText);
    makeDraggable(dateText);
    makeDraggable(stampImage);

    // ✅ 도장 회전 & 확대 기능
    let rotation = 0;
    let scale = 1;

    document.getElementById("rotateLeft").addEventListener("click", () => {
        rotation -= 15;
        stampImage.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        stampImage.setAttribute("data-rotation", rotation);
    });

    document.getElementById("rotateRight").addEventListener("click", () => {
        rotation += 15;
        stampImage.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        stampImage.setAttribute("data-rotation", rotation);
    });

    document.getElementById("zoomIn").addEventListener("click", () => {
        scale += 0.1;
        stampImage.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        stampImage.setAttribute("data-scale", scale);
    });

    document.getElementById("zoomOut").addEventListener("click", () => {
        if (scale > 0.5) {
            scale -= 0.1;
            stampImage.style.transform = `rotate(${rotation}deg) scale(${scale})`;
            stampImage.setAttribute("data-scale", scale);
        }
    });

    // ✅ 다운로드 기능 정상 작동
    document.getElementById("downloadBtn").addEventListener("click", () => {
            let backgroundImg = document.getElementById("cardBackground");
            let nameText = document.getElementById("nameText");
            let dateText = document.getElementById("dateText");
            let stampImage = document.getElementById("stampImage");

            let img = new Image();
            img.src = backgroundImg.src;
            img.onload = function () {
                let originalWidth = img.naturalWidth;
                let originalHeight = img.naturalHeight;

                let finalCanvas = document.createElement("canvas");
                let ctx = finalCanvas.getContext("2d");

                finalCanvas.width = originalWidth;
                finalCanvas.height = originalHeight;

                // 🔹 회원증 배경 그리기
                ctx.drawImage(img, 0, 0, finalCanvas.width, finalCanvas.height);

                // 🔹 크기 비율 계산 (미리보기 크기 대비 원본 크기)
                let previewWidth = backgroundImg.clientWidth;
                let previewHeight = backgroundImg.clientHeight;
                let scaleFactorX = originalWidth / previewWidth;
                let scaleFactorY = originalHeight / previewHeight;

                // 🔹 이름과 날짜 위치 가져오기
                function getElementPosition(el) {
                    let rect = el.getBoundingClientRect();
                    let previewRect = backgroundImg.getBoundingClientRect();
                    return {
                        x: (rect.left - previewRect.left) * scaleFactorX,
                        y: (rect.top - previewRect.top) * scaleFactorY
                    };
                }

                let namePos = getElementPosition(nameText);
                let datePos = getElementPosition(dateText);

                // 🔹 폰트 스타일 적용
                let fontSize = parseFloat(window.getComputedStyle(nameText).fontSize) * scaleFactorX;
                ctx.font = `bold ${fontSize}px Pretendard SemiBold, sans-serif`;
                ctx.fillStyle = "black";
                ctx.textAlign = "left";

                // 🔹 이름과 날짜 출력 (정확한 위치 반영!)
                ctx.fillText(nameText.textContent, namePos.x, namePos.y + 10); // +10으로 정확한 위치 맞춤
                ctx.fillText(dateText.textContent, datePos.x, datePos.y + 10);

                // 🔹 도장 추가 (위치, 크기, 회전 유지)
                if (stampImage.src && stampImage.style.display !== "none") {
                    let rotationAngle = parseFloat(stampImage.getAttribute("data-rotation")) || 0;
                    let scaleFactor = parseFloat(stampImage.getAttribute("data-scale")) || 1;

                    let stampRect = stampImage.getBoundingClientRect();
                    let previewRect = backgroundImg.getBoundingClientRect();

                    let stampWidth = stampRect.width * scaleFactor;
                    let stampHeight = stampRect.height * scaleFactor;
                    let stampX = (stampRect.left - previewRect.left) * scaleFactorX + (stampWidth / 2);
                    let stampY = (stampRect.top - previewRect.top) * scaleFactorY + (stampHeight / 2);


                    let stampTempImg = new Image();
                    stampTempImg.src = stampImage.src;
                    stampTempImg.onload = function () {
                        ctx.save();
                        ctx.translate(stampX, stampY);
                        ctx.rotate((rotationAngle * Math.PI) / 180);
                        ctx.drawImage(stampTempImg, -stampWidth / 2, -stampHeight / 2, stampWidth, stampHeight);
                        ctx.restore();

                        // 🔹 다운로드 실행
                        let link = document.createElement("a");
                        link.download = `membership_card_${getFormattedDate()}.png`;
                        link.href = finalCanvas.toDataURL("image/png", 1.0);
                        link.click();
                    };
                } else {
                    // 🔹 도장이 없을 경우 바로 다운로드 실행
                    let link = document.createElement("a");
                    link.download = `membership_card_${getFormattedDate()}.png`;
                    link.href = finalCanvas.toDataURL("image/png", 1.0);
                    link.click();
                }
            };
        });

});

  </script>

</body>
</html>
